name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      # Only the pure URL-matching / config logic is tested here — not a live
      # download, since YouTube frequently blocks requests from cloud CI
      # runners regardless of whether the code is correct. See README.
      - run: pytest tests/ -q
